services:
  # --- pricelio Backend ---
  pricelio-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ghcr.io/onebyjorah/pricelio-backend:latest
    container_name: pricelio-backend
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      COSTFORGE_LOG: /app/usage.jsonl
      COSTFORGE_DB: /app/data/pricelio.db
    volumes:
      - pricelio-data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # --- pricelio Frontend ---
  pricelio-frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    image: ghcr.io/onebyjorah/pricelio-frontend:latest
    container_name: pricelio-frontend
    ports:
      - "127.0.0.1:8090:8080"
    depends_on:
      pricelio-backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      # nginx listens on 8080 *inside* the container (unprivileged port, non-root
      # user). 8090 is only the host-side mapping, so probing it here never worked.
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:8080/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  pricelio-data:
    name: pricelio-data
