name: Docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  publish:
    uses: ./.github/workflows/reusable-docker.yml
    with:
      # Publish the FastAPI backend app. Context must be ./backend because
      # backend/Dockerfile copies requirements.txt relative to its context.
      # (The root Dockerfile is an unused shared-CI template, not the app.)
      context: ./backend
      dockerfile: Dockerfile
